name: HF mobile navigation - isolated UX checks
on:
  push:
    branches:
      - feature/hf-mobile-clean-navigation-v1
    paths:
      - 'src/hf-mobile-navigation.mjs'
      - 'index.html'
      - 'assets/hf-association.css'
      - 'tests/hf-mobile-navigation-smoke.mjs'
      - '.github/workflows/hf-mobile-navigation.yml'
  pull_request:
    paths:
      - 'src/hf-mobile-navigation.mjs'
      - 'index.html'
      - 'assets/hf-association.css'
      - 'tests/hf-mobile-navigation-smoke.mjs'
      - '.github/workflows/hf-mobile-navigation.yml'
permissions:
  contents: read
jobs:
  hf-mobile-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout isolated HF code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run HF mobile nav + regression tests (offline)
        run: |
          node --test \
            tests/hf-mobile-navigation-smoke.mjs \
            tests/hf-class-organization-smoke.mjs \
            tests/hf-organization-ui-smoke.mjs \
            tests/hf-stage-b-integration-smoke.cjs \
            tests/hf-class-display-smoke.cjs \
            tests/hf-device-modes-smoke.cjs \
            tests/hf-saved-workout-presenter-smoke.mjs \
            tests/hf-saved-display-integration-smoke.cjs \
            tests/hf-class-checkpoint-smoke.mjs \
            tests/hf-advanced-format-smoke.mjs \
            tests/hf-advanced-runtime-smoke.cjs \
            tests/hf-recovery-ui-smoke.cjs
