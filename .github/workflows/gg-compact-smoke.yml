name: QA GG Mobile compacta
on:
  push:
    branches:
      - test/gg-compact-smoke
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar DOM de pruebas
        run: npm install --no-save --no-audit --no-fund jsdom@26
      - name: Comprobar vista y descansos
        run: node tests/compact-workout-smoke.mjs
